
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>ShopEasy 🛍️</h1>
        <p>Find your favourite products</p>
        <div class="cart-info">
            🛒 Cart: <span id="cartCount">0</span> items
        </div>
    </header>

    <main>
        <h2>Our Products</h2>

        <section id="productList" class="products">
            <!-- Products will be added using JavaScript -->
        </section>

        <section class="cart-section">
            <h2>Shopping Cart</h2>

            <div id="cartItems">
                Your cart is empty.
            </div>

            <h3>Total: ₹<span id="totalPrice">0</span></h3>

            <button id="checkoutBtn">Proceed to Checkout</button>
        </section>
    </main>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <button id="closeModal" class="close-btn">×</button>
            <h2>Checkout Preview</h2>
            <div id="checkoutDetails"></div>
            <h3>Total: ₹<span id="checkoutTotal">0</span></h3>
            <button id="confirmBtn">Confirm Order</button>
        </div>
    </div>

    <footer>
        <p>ShopEasy | Mini E-Commerce Project</p>
    </footer>

</body>
</html>
